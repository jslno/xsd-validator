[package]
edition = "2021"
name = "xsd_validator"
version = "0.1.0"
license = "MIT"
description = "Node.js native addon for XSD validation via vendored libxml2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-derive = "3"

[target.'cfg(not(target_family = "wasm"))'.dependencies.napi]
version = "3"
features = ["napi9", "async"]

# Threadless WASI has no thread to run Tokio on; `create` chains JS promises instead.
[target.'cfg(target_family = "wasm")'.dependencies.napi]
version = "3"
features = ["napi9"]

[build-dependencies]
napi-build = "2.6"
cmake = "0.1"
cc = "1.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
